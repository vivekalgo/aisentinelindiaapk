<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Legal Sentinel - India</title>
  </head>
  <body>
    <script>
      // Global Error Handler for APK Debugging
      window.onerror = function(msg, url, line, col, error) {
        var div = document.createElement("div");
        div.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);color:#ff5555;z-index:9999;padding:20px;overflow:auto;font-family:monospace;white-space:pre-wrap;word-break:break-all;";
        div.innerHTML = "<h3>🚨 CRITICAL ERROR 🚨</h3>" + 
                        "<strong>Message:</strong> " + msg + "<br/><br/>" + 
                        "<strong>Location:</strong> " + url + ":" + line + ":" + col + "<br/><br/>" + 
                        "<strong>Stack:</strong><br/>" + (error ? error.stack : "N/A");
        document.body.appendChild(div);
      };
      
      // Capture Unhandled Promise Rejections
      window.addEventListener('unhandledrejection', function(event) {
        var div = document.createElement("div");
        div.style.cssText = "position:fixed;bottom:0;left:0;width:100%;height:50%;background:rgba(50,0,0,0.9);color:#ffaaaa;z-index:9998;padding:20px;overflow:auto;font-family:monospace;white-space:pre-wrap;";
        div.innerHTML = "<h3>⚠️ UNHANDLED PROMISE ⚠️</h3>" + 
                        "<strong>Reason:</strong> " + event.reason;
        document.body.appendChild(div);
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
